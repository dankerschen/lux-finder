<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Luxembourg quadrant finder</title>
<style>
  :root {
    --ink: #14222E;
    --muted: #596976;
    --line: #CFD8DE;
    --page: #F1F4F6;
    --sheet: #FFFFFF;
    --sky: #00A1DE;
    --sky-soft: rgba(0, 161, 222, .20);
    --red: #E5202E;
    --amber: #8A5200;
    --amber-bg: #FFF3D6;
    --amber-line: #E3A21A;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--ink);
    font: 16px/1.5 "Avenir Next", "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  .app {
    max-width: 960px;
    margin: 0 auto;
    padding: 28px 20px 44px;
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 440px);
    gap: 44px;
    align-items: start;
  }
  .app > * { min-width: 0; }
  h1 { margin: 0 0 18px; font-size: 20px; font-weight: 700; letter-spacing: -.01em; }

  /* search */
  form { display: flex; gap: 8px; }
  label.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  input[type=search] {
    flex: 1; width: 0; min-width: 0;
    font: inherit; font-size: 17px;
    padding: 12px 14px;
    color: var(--ink); background: var(--sheet);
    border: 2px solid var(--ink); border-radius: 10px;
    -webkit-appearance: none; appearance: none;
  }
  input[type=search]::placeholder { color: #8795A0; }
  button { font: inherit; cursor: pointer; }
  button.go {
    padding: 12px 20px; font-weight: 600;
    color: #fff; background: var(--ink);
    border: 2px solid var(--ink); border-radius: 10px;
  }
  button.go:active { transform: translateY(1px); }
  :focus-visible { outline: 3px solid var(--sky); outline-offset: 2px; }

  .suggest { list-style: none; margin: 8px 0 0; padding: 0; }
  .suggest li + li { border-top: 1px solid var(--line); }
  .suggest button {
    display: block; width: 100%; text-align: left;
    padding: 9px 4px; background: none; border: 0; color: var(--ink);
  }
  .suggest button:hover { background: rgba(0,0,0,.04); }
  .suggest small { color: var(--muted); margin-left: 8px; }

  /* result */
  #result { margin-top: 26px; min-height: 230px; }
  .empty { color: var(--muted); margin: 0; max-width: 34ch; }
  .code {
    font-size: clamp(76px, 15vw, 116px); line-height: .92;
    font-weight: 800; letter-spacing: -.035em;
    font-variant-numeric: tabular-nums;
  }
  .place { margin: 10px 0 0; font-size: 22px; font-weight: 650; line-height: 1.2; }
  .where { margin: 2px 0 0; color: var(--muted); }
  .edge {
    margin: 16px 0 0; padding: 10px 12px; max-width: 44ch;
    background: var(--amber-bg); color: var(--amber);
    border-left: 4px solid var(--amber-line); border-radius: 0 8px 8px 0;
  }
  .edge strong { color: #5E3700; }
  .aside { margin: 14px 0 0; color: var(--muted); max-width: 44ch; }
  .miss { margin: 0; max-width: 40ch; }

  .row { margin-top: 18px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .row .lead { color: var(--muted); margin-right: 4px; font-size: 14px; }
  .chip {
    padding: 5px 11px; font-size: 14px;
    color: var(--ink); background: var(--sheet);
    border: 1px solid var(--line); border-radius: 999px;
  }
  .chip:hover { border-color: var(--ink); }
  .chip em { font-style: normal; font-weight: 700; margin-left: 4px; }
  .chip.edgy em::after { content: " · border"; font-weight: 500; color: var(--amber); }
  button.clear { background: none; border: 0; color: var(--muted); text-decoration: underline; padding: 5px 4px; font-size: 14px; }

  .fine { margin: 30px 0 0; color: var(--muted); font-size: 13px; max-width: 46ch; }

  /* map */
  .sheet {
    background: var(--sheet);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 0;
    position: sticky; top: 16px;
  }
  .stage { position: relative; line-height: 0; }
  .stage img { width: 100%; height: auto; display: block; -webkit-user-select: none; user-select: none; }
  .cell {
    position: absolute; pointer-events: none; opacity: 0;
    transition: left .45s cubic-bezier(.2,.8,.2,1), top .45s cubic-bezier(.2,.8,.2,1), opacity .2s;
  }
  .cell.on { opacity: 1; }
  .cell.main { background: var(--sky-soft); outline: 2px solid var(--sky); outline-offset: -2px; }
  .cell.alt { outline: 2px dashed var(--sky); outline-offset: -2px; background: rgba(0,161,222,.07); }
  .pin {
    position: absolute; width: 0; height: 0; pointer-events: none; opacity: 0;
    transition: left .5s cubic-bezier(.2,.8,.2,1), top .5s cubic-bezier(.2,.8,.2,1), opacity .15s;
  }
  .pin.on { opacity: 1; }
  .pin svg {
    position: absolute; left: -14px; bottom: 0; width: 28px; height: 40px; overflow: visible;
    filter: drop-shadow(0 2px 2px rgba(0,0,0,.35));
  }
  .pin.drop svg { animation: drop .45s cubic-bezier(.3,1.4,.5,1); }
  .pin i {
    position: absolute; left: -9px; top: -9px; width: 18px; height: 18px; border-radius: 50%;
    border: 2px solid var(--red); opacity: 0;
  }
  .pin.drop i { animation: ping .8s .25s ease-out; }
  @keyframes drop { from { transform: translateY(-22px); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes ping { from { transform: scale(.4); opacity: .9; } to { transform: scale(1.8); opacity: 0; } }

  @media (max-width: 820px) {
    .app { grid-template-columns: minmax(0, 1fr); gap: 26px; padding-top: 20px; }
    .sheet { position: static; max-width: 460px; }
    #result { min-height: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    .cell, .pin, .pin svg, .pin i { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>
<main class="app">
  <section>
    <h1>Luxembourg quadrant finder</h1>
    <form id="form" autocomplete="off">
      <label class="sr" for="q">Town or commune</label>
      <input id="q" type="search" placeholder="Town or commune, e.g. Echternach" enterkeyhint="search" autocapitalize="words" spellcheck="false">
      <button class="go" type="submit">Find</button>
    </form>
    <ul id="suggest" class="suggest" aria-label="Matching places"></ul>

    <div id="result" aria-live="polite"></div>
    <div id="recent" class="row" hidden></div>
    <p class="fine">Pins are placed from each town's coordinates, so they are approximate. A place marked as a border case could sit in the neighbouring cell on your own copy of the map.</p>
  </section>
